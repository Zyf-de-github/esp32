; PlatformIO Project Configuration File
;
; Build/upload commands:
;   pio run                       — compile
;   pio run --target upload       — compile & flash
;   pio device monitor            — open serial monitor
;   pio run --target uploadfs     — upload SPIFFS/LittleFS filesystem (if used)

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Library dependencies (resolved automatically by PlatformIO)
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8.0

; Compiler flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Upload & monitor port (uncomment and adjust if auto-detection fails)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
